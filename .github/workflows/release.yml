name: Release Windows amd64 (v3)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.0). If empty, only builds and uploads artifact."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows-amd64-v3:
    name: Build & Release Windows amd64 (GOAMD64=v3)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cf-scanner
        shell: pwsh
    env:
      CGO_ENABLED: "0"
      GOOS: "windows"
      GOARCH: "amd64"
      GOAMD64: "v3"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cf-scanner/go.mod
          cache: true
          cache-dependency-path: cf-scanner/go.sum

      - name: Tidy & Verify Dependencies
        run: |
          go mod tidy
          go vet ./...

      - name: Run Tests
        run: |
          go test -v ./...

      - name: Generate Windows High-DPI Manifest & Icon (.syso)
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64

      - name: Build Windows amd64 (GOAMD64=v3) Binaries
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Desktop GUI Binary (suppresses console flash)
          go build -trimpath -tags "desktop,production" -ldflags "-s -w -H=windowsgui" -o dist/cf-scanner.exe .
          # Standalone CLI Binary
          go build -trimpath -ldflags "-s -w" -o dist/cf-scanner-cli.exe ./cmd/cli
          Get-Item dist/*.exe | Select-Object Name, Length

      - name: Package Release Archive & SHA256 Checksum
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item dist/cf-scanner.exe dist/stage/
          Copy-Item dist/cf-scanner-cli.exe dist/stage/
          $assets = @(
            "conf.json",
            "ipv4.txt",
            "ipv4_old.txt",
            "ipv6.txt",
            "cloudfalare-domains.txt",
            "cloudfalare-domains-full.txt",
            "cloudflare-iran-domains.txt",
            "Akamai.txt",
            "Fastly.txt",
            "README.md",
            "LICENSE"
          )
          foreach ($f in $assets) {
            if (Test-Path $f) {
              Copy-Item $f dist/stage/
            }
          }
          $zipPath = "dist/cf-scanner-windows-amd64-v3.zip"
          Compress-Archive -Path "dist/stage/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  cf-scanner-windows-amd64-v3.zip" | Out-File -FilePath "dist/cf-scanner-windows-amd64-v3.zip.sha256" -Encoding utf8

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-scanner-windows-amd64-v3
          path: |
            cf-scanner/dist/cf-scanner-windows-amd64-v3.zip
            cf-scanner/dist/cf-scanner-windows-amd64-v3.zip.sha256

      - name: Publish or Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            cf-scanner/dist/cf-scanner-windows-amd64-v3.zip
            cf-scanner/dist/cf-scanner-windows-amd64-v3.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
