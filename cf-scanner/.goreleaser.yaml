# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: cf-scanner

before:
  hooks:
    - go mod tidy
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64

builds:
  - id: windows-amd64-v3
    main: .
    binary: cf-scanner
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    goamd64:
      - v3
    tags:
      - desktop
      - production
    flags:
      - -trimpath
    ldflags:
      - -s -w -H=windowsgui

archives:
  - id: windows-amd64-v3-archive
    builds:
      - windows-amd64-v3
    formats:
      - zip
    name_template: "cf-scanner-windows-amd64-v3"
    files:
      - conf.json
      - ipv4.txt
      - ipv4_old.txt
      - ipv6.txt
      - cloudfalare-domains.txt
      - cloudflare-iran-domains.txt
      - Akamai.txt
      - Fastly.txt
      - README.md
      - LICENSE

checksum:
  name_template: "cf-scanner-windows-amd64-v3-checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  replace_existing_artifacts: true
  footer: >-

    ---

    Built for **Windows x64 (`GOAMD64=v3`)** with Wails v2 & WebView2.
