name: Release Windows amd64 (v3)

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag (e.g. v2.0.0) when triggered manually"
        required: false
        default: ""

permissions:
  contents: write

# Prevent duplicate concurrent runs for the same ref/tag
concurrency:
  group: release-windows-amd64-v3-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows-amd64-v3:
    name: Build & Release Windows amd64 (GOAMD64=v3)
    runs-on: windows-latest
    # Avoid duplicate double-runs when a v* tag push already triggers this workflow
    # and publishing the release for that same v* tag fires a second event:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !startsWith(github.event.release.tag_name, 'v'))
    env:
      CGO_ENABLED: "0"
      GOOS: "windows"
      GOARCH: "amd64"
      GOAMD64: "v3"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Tidy & Verify Dependencies
        shell: pwsh
        run: |
          go mod tidy
          go vet ./...

      - name: Generate Windows High-DPI Manifest & Icon (.syso)
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres make --in winres/winres.json --arch amd64

      - name: Build Windows amd64 (GOAMD64=v3) Desktop GUI Binary
        shell: pwsh
        run: |
          go build -trimpath -tags "desktop,production" -ldflags "-s -w -H=windowsgui" -o dist/cf-scanner.exe .
          Get-Item dist/cf-scanner.exe | Select-Object Name, Length

      - name: Package Release Archive & SHA256 Checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item dist/cf-scanner.exe dist/stage/
          $assets = @(
            "conf.json",
            "ipv4.txt",
            "ipv4_old.txt",
            "ipv6.txt",
            "cloudfalare-domains.txt",
            "cloudflare-iran-domains.txt",
            "Akamai.txt",
            "Fastly.txt",
            "README.md",
            "LICENSE"
          )
          foreach ($f in $assets) {
            if (Test-Path $f) {
              Copy-Item $f dist/stage/
            }
          }
          $zipPath = "dist/cf-scanner-windows-amd64-v3.zip"
          Compress-Archive -Path "dist/stage/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLower()
          "$hash  cf-scanner-windows-amd64-v3.zip" | Out-File -FilePath "dist/cf-scanner-windows-amd64-v3.zip.sha256" -Encoding utf8

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cf-scanner-windows-amd64-v3
          path: |
            dist/cf-scanner-windows-amd64-v3.zip
            dist/cf-scanner-windows-amd64-v3.zip.sha256

      - name: Publish or Attach to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/cf-scanner-windows-amd64-v3.zip
            dist/cf-scanner-windows-amd64-v3.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
